        # signed-integer overflow occurs while evaluating `x + 1`, whose
        # containing statement is `y = x + 1;`. A target waypoint points at the
        # first character of that statement.
        type: target
        action: follow
        thread_id: 0
        location:
          file_name: "./concurrent-no-overflow.c"
          line: 25
