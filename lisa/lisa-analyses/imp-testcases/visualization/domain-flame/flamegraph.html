		// ---------------------------------------------------------------
		// FLATTENING THE GRAPH FOR POPULATING THE NODES LIST
		// ---------------------------------------------------------------
		const nodes = [];
		function walk(node, depth = 0) {
			const text = String(node.text);
			const start = Number(node.start_ns);
			const end = Number(node.end_ns);
			if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
				console.log("Discarding data at depth " + depth + " (" + text + "): invalid start or end time. Graph will be incomplete.");
				console.log("start: " + start + ", end: " + end);
				return;
			}

			const duration = end - start;
			let kind;
			if (text.startsWith("Analysis:")) kind = "Analysis";
			else if (text.match(/^[a-zA-Z0-9_]+:/)) kind = "Domain";
			else if (text.toLowerCase().includes("fixpoint")) kind = "Interprocedural";
			else kind = "Fixpoint";

			nodes.push({text, start, end, duration, kind, depth});
			for (const c of node.children || []) walk(c, depth + 1);
		}
		walk(JSON.parse(graph));

			.append("svg")
			.attr("width", width)
			.attr("height", height);

		const zoomLayer = svg.append("g")
			.attr("transform", `translate(0, ${axisHeight})`);

		// ---------------------------------------------------------------
		// BUILDING THE AXIS AND GRID TO DRAW ON TOP OF THE GRAPH 
		// ---------------------------------------------------------------
		function formatAxisTicks(d) {
			// d is nanoseconds offset from minTime
			const ms = (d - minTime) / 1e6;
			if (ms < 1) return ((d - minTime) / 1e3).toFixed(0) + " μs";
			if (ms < 1000) return ms.toFixed(0) + " ms";
			const s = ms / 1000;
			if (s < 60) return s.toFixed(2) + " s";
			const m = Math.floor(s / 60);
			const sec = s % 60;
			if (m < 60) return `${m}m ${sec.toFixed(1)}s`;
			const h = Math.floor(m / 60);
			const min = m % 60;
			return `${h}h ${min}m`;

		const axisBG = svg.append("rect")
			.attr("id", "axis-bg")

		const axisGroup = svg.append("g")
			.attr("transform", `translate(0,${axisHeight})`)
			.call(axis);

			axisGroup.selectAll(".grid-line").remove();
			axisGroup.selectAll(".tick").each(function (d) {
				axisGroup.append("line")
					.attr("class", "grid-line")
					.attr("x1", currentScale(d))
					.attr("x2", currentScale(d))
					.attr("y1", 0)
					.attr("y2", height);

		// ---------------------------------------------------------------
		const zoom = d3.zoom()
			// min zoom of 1 (cannot reduce graph size), max zoom of 100 (arbitrary, can be adjusted)
			.scaleExtent([1, 100])
			.on("zoom", (event) => {
				const t = event.transform;
				const scale = t.k;

				// set up clamping so we cannot pan the graph out of view
				const maxX = 0;
				const maxY = 0;
				const minX = Math.min(width - width * scale, 0);
				const minY = Math.min(height - height * scale, 0);
				const clampedX = Math.max(Math.min(t.x, maxX), minX);
				const clampedY = Math.max(Math.min(t.y, maxY), minY);
				const clamped = t.x !== clampedX || t.y !== clampedY;

		const tooltip = d3.select("#heatmap-tooltip");
		function showTooltip(event, d) {
			tooltip

		}
		function moveTooltip(event) {
			const pad = 12;
			const w = tooltip.node().offsetWidth;
			const h = tooltip.node().offsetHeight;

			let x = event.pageX + pad;
			let y = event.pageY + pad;

			if (x + w > window.innerWidth) x = event.pageX - w - pad;
			if (y + h > window.innerHeight) y = event.pageY - h - pad;

			tooltip.style("left", x + "px").style("top", y + "px");

			tooltip.style("opacity", 0);

		const categoryHue = {

		const durationByKind = d3.group(nodes, d => d.kind);
		const scalesByKind = new Map(

					.domain(d3.extent(arr, d => d.duration))

			const scale = scalesByKind.get(d.kind);
			return `hsl(${hue}, 70%, ${scale(d.duration)}%)`;
		}
		const rects = zoomLayer.selectAll("rect")
			.data(nodes)
			.enter()
			.append("rect")
			.attr("class", "heatmap-node")
			.attr("x", d => xScale(d.start))
			.attr("y", d => d.depth * rowHeight)
			.attr("width", d => xScale(d.end) - xScale(d.start))
			.attr("height", rowHeight - 2)
			.attr("fill", nodeColor)
			.on("mouseenter", showTooltip)
			.on("mousemove", moveTooltip)
			.on("mouseleave", hideTooltip);

		// LABELS TO DISPLAY INSIDE EACH NODE, HIDDEN IF TOO LONG
		// ---------------------------------------------------------------
		const labels = zoomLayer.selectAll("text")
			.data(nodes)
			.enter()
			.append("text")
			.attr("class", "heatmap-label")
			.attr("x", d => xScale(d.start) + 4)

			.on("mousemove", moveTooltip)

			const visibleYMin = -ty / scale;
			const visibleYMax = (mainGraphHeight - ty) / scale;
			const y1 = Math.max(0, visibleYMin / mainGraphHeight * overviewHeight);
			const y2 = Math.min(overviewHeight, visibleYMax / mainGraphHeight * overviewHeight);

			overviewViewport
				.attr("x", x1)
				.attr("width", Math.max(10, x2 - x1))
				.attr("y", y1)
				.attr("height", Math.max(5, y2 - y1));
			overviewSvg.select("#overview-mask-hole")
				.attr("x", x1)
				.attr("y", y1)
				.attr("width", Math.max(10, x2 - x1))
				.attr("height", Math.max(5, y2 - y1));
			overlay
				.attr("width", width)
				.attr("height", overviewHeight);
		}
		updateOverviewViewport();

		// ---------------------------------------------------------------
		// LISTENING FOR RESIZE EVENTS
		// ---------------------------------------------------------------
		window.addEventListener("resize", () => {
			width = window.innerWidth;
			height = window.innerHeight - headerHeight - overviewHeight - 5;
			overviewRowHeight = Math.max(2, rowHeight * overviewHeight / height);

			xScale.range([0, width]);
			svg.attr("width", width).attr("height", height);
			overviewSvg.attr("width", width);

			// Update axis and grid
			axis.ticks(Math.max(5, width / 180));
			axisGroup.call(axis.scale(xScale));
			drawGridLines(xScale);

			// Update main graph rectangles and labels
			rects
				.attr("x", d => xScale(d.start))
				.attr("width", d => xScale(d.end) - xScale(d.start))
				.attr("y", d => d.depth * rowHeight)
				.attr("height", rowHeight - 2);
			labels
				.attr("x", d => xScale(d.start) + 4)
				.attr("y", d => d.depth * rowHeight + rowHeight * 0.7);
			overviewRects
				.attr("x", d => xScale(d.start))
				.attr("width", d => xScale(d.end) - xScale(d.start))
				.attr("y", d => d.depth * overviewRowHeight)
				.attr("height", overviewRowHeight - 1);

			axisBG.attr("width", width);

			updateLabels();
			updateOverviewViewport();
			svg.call(zoom.transform, d3.zoomTransform(svg.node()));
		});

		// ---------------------------------------------------------------
		// SEARCH TO FIND NODES BY TEXT
		// ---------------------------------------------------------------
		d3.select("#search").node().value = "";
		var hits = [];
		var hit = -1;
		function centerToSearch() {
			rects.classed("heatmap-highlight", false);
			const idx = hits[hit];
			rects.filter((_, j) => j === idx).classed("heatmap-highlight", true);

			const n = nodes[idx];
			const cx = (xScale(n.start) + xScale(n.end)) / 2;
			const cy = n.depth * rowHeight;

			svg.transition().duration(300).call(
				zoom.transform,
				d3.zoomIdentity
					.translate(width / 2 - cx, height / 2 - cy)
					.scale(1.5)
			);
		}
		d3.select("#search").on("input", function (e) {
			var query = e.target.value.toLowerCase();
			hits = [];
			if (query !== "")
				nodes.forEach((n, i) => {
					if (n.text.toLowerCase().includes(query)) hits.push(i);
				});
			rects.classed("heatmap-highlight", false);
			if (query === "" || hits.length == 0) {
				hit = -1;
				d3.select("#next").attr("disabled", true);
				d3.select("#prev").attr("disabled", true);
				d3.select(this).classed("no-results", true);
			} else {
				hit = 0;
				d3.select("#next").attr("disabled", null);
				d3.select("#prev").attr("disabled", null);
				d3.select(this).classed("no-results", false);
				centerToSearch();
			}
		});
		d3.select("#next").on("click", function (e) {
			if (hit != -1) {
				hit = (hit + 1) % hits.length;
				centerToSearch();
			}
		});
		d3.select("#prev").on("click", function (e) {
			if (hit != -1) {
				hit = (hit - 1 + hits.length) % hits.length;
				centerToSearch();
			}
		});

		// ---------------------------------------------------------------
		// LEGEND MODAL LOGIC
		// ---------------------------------------------------------------
		var modal = d3.select("#legend").on("click", function () {
			d3.select(this).style("display", "none");
		});
		var btn = d3.select("#legendButton").on("click", function () {
			modal.style("display", "block");
		});
		var span = d3.select(".close").on("click", function () {
			modal.style("display", "none");
		});
	</script>
</body>

</html>
