plugins.withType(JavaPlugin) {
	if (git_ready) {
		jar.doFirst {
			manifest {
				attributes(
					'Implementation-Title': project.name,
					'Implementation-Version': project.version,
					'Implementation-Vendor': 'Ca\' Foscari University of Venice',
					'Created-By': "Gradle ${gradle.gradleVersion}",
					'Build-Revision': git_cid,
					'Build-Tag': git_tag,
					'Build-Branch': git_branch,
					'Build-Clean': git_is_clean,
					'Build-Timestamp': new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
					'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
					'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
				)
			}
		}
	}
}

compileJava {
	options.debug = true
	options.debugOptions.debugLevel = "source,lines,vars"
	sourceCompatibility = '11'
	targetCompatibility = '11'
}

compileTestJava {
	options.debug = true
	options.debugOptions.debugLevel = "source,lines,vars"
	sourceCompatibility = '11'
	targetCompatibility = '11'
}

java {
	withJavadocJar()
	withSourcesJar()
}

javadoc {
	if(JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
	options {
		links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
		addStringOption('Xdoclint:none', '-quiet')
	}
}

test {
	useJUnitPlatform()

	filter {
		includeTestsMatching 'it.unive.lisa.*'
		excludeTestsMatching 'it.unive.lisa.cron.*'
	}

	testLogging {
		showStandardStreams = false
		events "failed"
		exceptionFormat "full"
	}

	def outputs = [:]  // map from test ID -> output buffer
	onOutput { descriptor, event ->
		def buf = outputs.computeIfAbsent(descriptor.id) { new StringBuilder() }
		buf.append(event.message)
	}

	afterTest { desc, result ->
		if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
			def buf = outputs.remove(desc.id)
			if (buf) {
				println "=== Captured output for ${desc.className}.${desc.name} ==="
				print buf.toString()
				println "============================================================="
			}
		} else {
			outputs.remove(desc.id)
		}
	}
}

tasks.register('cron', Test) {
	description = 'Runs cron tests'
	group = 'verification'

	useJUnitPlatform()

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		failOnNoMatchingTests false
		includeTestsMatching 'it.unive.lisa.cron.*'
	}

	// runs the full triage benchmark (see TriageBenchmarkTest)
	systemProperty "lisa.triage.full", System.getProperty("lisa.triage.full", "false")

	testLogging {
		showStandardStreams = false
		events "failed"
		exceptionFormat "full"
	}

	def outputs = [:]  // map from test ID -> output buffer
	onOutput { descriptor, event ->
		def buf = outputs.computeIfAbsent(descriptor.id) { new StringBuilder() }
		buf.append(event.message)
	}

	afterTest { desc, result ->
		if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
			def buf = outputs.remove(desc.id)
			if (buf) {
				println "=== Captured output for ${desc.className}.${desc.name} ==="
				print buf.toString()
				println "============================================================="
			}
		} else {
			outputs.remove(desc.id)
		}
	}
}

tasks.register('update-cron', Test) {
	description = 'Runs cron tests, updating expected results of failed ones'
	group = 'verification'

	useJUnitPlatform()

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty "lisa.cron.update", "true"
	// runs the full triage benchmark (see TriageBenchmarkTest)
	systemProperty "lisa.triage.full", System.getProperty("lisa.triage.full", "false")

	filter {
		failOnNoMatchingTests false
		includeTestsMatching 'it.unive.lisa.cron.*'
	}
}

tasks.register('allTests') {
	description = 'Runs unit tests and cron tests'
	group = 'verification'
	dependsOn test, cron
}

tasks.register('completeBuild') {
	description = 'build + cron + checkCodeStyle'
	group = 'build'
	dependsOn build, cron, checkCodeStyle
}

